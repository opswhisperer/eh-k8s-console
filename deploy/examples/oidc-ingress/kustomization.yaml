# OIDC sign-in behind an Ingress (ingress-nginx + cert-manager shown). Same Secret as
# examples/oidc-gateway.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: extrahop
resources:
  - ../../base
  - ingress.yaml
configMapGenerator:
  - name: eh-k8s-console-config
    behavior: replace
    files:
      - config.yaml
