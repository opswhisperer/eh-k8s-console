listen: ":8080"
auth:
  # API keys keep scripts working without going through the proxy's browser login.
  modes: [proxy, apikey]
  apiKeys:
    file: /secrets/api-keys.yaml
  proxy:
    # Source addresses of the proxy pods (your pod CIDR, or tighter). Never 0.0.0.0/0.
    trustedCIDRs: [10.244.0.0/16]
    # The proxy must add this header (value from Secret key proxy-secret) to every request.
    sharedSecret: { file: /secrets/proxy-secret }
    userHeader: X-Forwarded-User        # oauth2-proxy: X-Forwarded-User / X-Forwarded-Groups
    groupsHeader: X-Forwarded-Groups    # Authentik: X-authentik-username / X-authentik-groups
    emailHeader: X-Forwarded-Email
    roles:
      platform-admins: admin
      platform-oncall: operator
  defaultRole: viewer   # anyone the proxy lets through, with no mapped group
