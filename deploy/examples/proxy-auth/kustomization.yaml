# Sign-in handled by an authenticating proxy in front of the console (oauth2-proxy, Authentik or
# Authelia forward auth, Pomerium…). The proxy must strip these headers from client requests and
# set them itself, plus X-Console-Proxy-Secret. The NetworkPolicy lets only the proxy reach the
# console's UI port; edit its selectors for your proxy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: extrahop
resources:
  - ../../base
  - networkpolicy.yaml
configMapGenerator:
  - name: eh-k8s-console-config
    behavior: replace
    files:
      - config.yaml
