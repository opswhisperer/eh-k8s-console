# Username/password sign-in without an identity provider (bcrypt hashes in a Secret).
#   eh-k8s-console hash-password      # or: docker run --rm -i ghcr.io/opswhisperer/eh-k8s-console hash-password
#   cat > users.yaml <<'USERS'
#   - username: alice
#     passwordHash: '$2a$12$…'
#     role: admin
#   USERS
#   kubectl create secret generic eh-k8s-console -n extrahop \
#     --from-literal=session-secret="$(openssl rand -base64 48)" --from-file=users.yaml=./users.yaml
#   kubectl apply -k .
#   kubectl -n extrahop port-forward svc/eh-k8s-console 8080:80
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: extrahop
resources:
  - ../../base
configMapGenerator:
  - name: eh-k8s-console-config
    behavior: replace
    files:
      - config.yaml
