apiVersion: v1
kind: ServiceAccount
metadata:
  name: eh-k8s-console
  labels:
    app.kubernetes.io/name: eh-k8s-console
    app.kubernetes.io/part-of: eh-k8s-console
---
# What the console needs inside the integration's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eh-k8s-console
  labels:
    app.kubernetes.io/name: eh-k8s-console
    app.kubernetes.io/part-of: eh-k8s-console
rules:
  # Integration ConfigMap (read + edit), revision history and alert state (create/prune).
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # Integration Secrets: values are read only server-side (key-pair check, Helm export with
  # secrets for admins) and replaced write-only. Limited to the three integration Secrets.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - extrahop-kubernetes-integration-sensor-api-credentials
      - extrahop-kubernetes-integration-exkpkt-coordinator
      - extrahop-kubernetes-integration-exkpkt-forwarder
    verbs: [get, update]
  - apiGroups: [""]
    resources: [pods, pods/log, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch, create]
  - apiGroups: [apps]
    resources: [deployments, daemonsets]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eh-k8s-console
  labels:
    app.kubernetes.io/name: eh-k8s-console
    app.kubernetes.io/part-of: eh-k8s-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eh-k8s-console
subjects:
  - kind: ServiceAccount
    name: eh-k8s-console
---
# Cluster-wide, read-only: namespace names (to check the mirror/skip lists).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eh-k8s-console
  labels:
    app.kubernetes.io/name: eh-k8s-console
    app.kubernetes.io/part-of: eh-k8s-console
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eh-k8s-console
  labels:
    app.kubernetes.io/name: eh-k8s-console
    app.kubernetes.io/part-of: eh-k8s-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eh-k8s-console
subjects:
  - kind: ServiceAccount
    name: eh-k8s-console
    namespace: extrahop
