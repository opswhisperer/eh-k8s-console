apiVersion: v1
kind: Service
metadata:
  name: eh-k8s-console
  labels:
    app.kubernetes.io/name: eh-k8s-console
    app.kubernetes.io/part-of: eh-k8s-console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eh-k8s-console
  ports:
    - name: http
      port: 80
      targetPort: http
    # Metrics have no auth: keep this port off any public route.
    - name: metrics
      port: 9090
      targetPort: metrics
