apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eh-k8s-console
  labels:
    app.kubernetes.io/name: eh-k8s-console
    app.kubernetes.io/part-of: eh-k8s-console
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-secret-store            # your store (Vault/OpenBao, AWS, GCP, Azure, 1Password…)
  target:
    name: eh-k8s-console             # mounted by the Deployment at /secrets
    creationPolicy: Owner
  data:
    # One entry per file named in config.yaml. Remove the ones your auth modes don't use.
    - secretKey: session-secret
      remoteRef: { key: eh-k8s-console, property: session-secret }
    - secretKey: oidc-client-secret
      remoteRef: { key: eh-k8s-console, property: oidc-client-secret }
    - secretKey: api-keys.yaml
      remoteRef: { key: eh-k8s-console, property: api-keys.yaml }
